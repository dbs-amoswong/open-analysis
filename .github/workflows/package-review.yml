name: package-review

on:
  workflow_dispatch:
    inputs:
      packages:
        description: npm package names, comma or newline separated
        required: true
      requirement:
        description: Requirement ID or slug (for example req-deep-merge)
        required: true
      version:
        description: Optional exact version applied to packages without one
        required: false
      mode:
        description: Review mode
        type: choice
        options: [batch, separate]
        default: batch
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: package-review-${{ github.event.issue.number || inputs.packages || github.run_id }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'review-request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGES: ${{ inputs.packages }}
      REQUIREMENT: ${{ inputs.requirement }}
      VERSION: ${{ inputs.version }}
      REVIEW_MODE: ${{ inputs.mode }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      REQUESTER: ${{ github.event.issue.user.login }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authorize labeler
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REVIEW_LABELERS: ${{ vars.REVIEW_LABELERS }}
        run: |
          set -euo pipefail

          ALLOW=$(printf '%s' "${REVIEW_LABELERS:-}" | tr -d ' ')
          if [ -n "$ALLOW" ]; then
            case ",$ALLOW," in
              *",$SENDER,"*)
                echo "Authorized by REVIEW_LABELERS: $SENDER"
                exit 0
                ;;
              *)
                echo "::error::$SENDER is not in the REVIEW_LABELERS allowlist."
                exit 1
                ;;
            esac
          fi

          PERMISSION=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${SENDER}/permission" --jq '.permission' 2>/dev/null || true)
          case "$PERMISSION" in
            admin|maintain|write)
              echo "Authorized collaborator: $SENDER ($PERMISSION)"
              ;;
            *)
              echo "::error::$SENDER does not have write access; only repository collaborators can start a review."
              exit 1
              ;;
          esac

      - name: Check model configuration
        run: |
          test -n "$OPENCODE_MODEL" || {
            echo "::error::Set the repository variable OPENCODE_MODEL, for example anthropic/claude-sonnet-5-5."
            exit 1
          }
          case "$OPENCODE_MODEL" in
            */*) ;;
            *)
              echo "::error::OPENCODE_MODEL must be provider/model. Got: [$OPENCODE_MODEL]. Use opencode/deepseek-v4.1-flash-free for the free OpenCode model."
              exit 1
              ;;
          esac
          echo "Using model: $OPENCODE_MODEL"

      - name: Prepare request
        id: prepare
        run: node scripts/prepare-request.mjs

      - name: Read resolved request
        id: meta
        run: |
          REQUIREMENT=$(node -p "require('./ai/request.json').requirement_id")
          echo "requirement=$REQUIREMENT" >> "$GITHUB_OUTPUT"
          echo "Resolved requirement: $REQUIREMENT"

      - name: Collect evidence
        if: steps.prepare.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ai/dossiers
          for request in ai/requests/*.json; do
            [ -e "$request" ] || { echo "No package requests found"; exit 1; }
            key=$(basename "$request" .json)
            echo "::group::Collect $key"
            node scripts/collect.mjs --request "$request" --out "ai/dossiers/$key.json"
            echo "::endgroup::"
          done

      - name: Install OpenCode
        if: steps.prepare.outputs.skip != 'true'
        run: npm install --global @opencode/cli@2.2.0

      - name: Draft reviews with OpenCode
        if: steps.prepare.outputs.skip != 'true'
        env:
          REQUIREMENT: ${{ steps.meta.outputs.requirement }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ai/reviews
          for dossier in ai/dossiers/*.json; do
            [ -e "$dossier" ] || { echo "No dossiers found"; exit 1; }
            key=$(basename "$dossier" .json)
            echo "::group::OpenCode draft: $key"
            opencode run --standalone \
              --agent package-review \
              --model "$OPENCODE_MODEL" \
              --title "Package review: $key for $REQUIREMENT" \
              "Read ai/requests/$key.json and ai/dossiers/$key.json. Write ai/reviews/$key.json only. Follow the package-review agent instructions exactly."
            echo "::endgroup::"
          done

      - name: Verify drafts
        if: steps.prepare.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for review in ai/reviews/*.json; do
            [ -e "$review" ] || { echo "No reviews were written"; exit 1; }
            key=$(basename "$review" .json)
            echo "::group::Verify $key"
            node scripts/verify-review.mjs --review "$review" --dossier "ai/dossiers/$key.json"
            echo "::endgroup::"
          done

      - name: Add drafts to the working tree
        if: steps.prepare.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for review in ai/reviews/*.json; do
            [ -e "$review" ] || { echo "No reviews were written"; exit 1; }
            key=$(basename "$review" .json)
            node scripts/publish-review.mjs --review "$review" --dossier "ai/dossiers/$key.json" --request "ai/requests/$key.json"
          done

      - name: Build suite context
        if: steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.mode == 'batch' && steps.prepare.outputs.count != '1'
        run: node scripts/collect-suite.mjs --request ai/request.json --dossiers ai/dossiers --reviews ai/reviews --out ai/suite/input.json

      - name: Draft suite review with OpenCode
        if: steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.mode == 'batch' && steps.prepare.outputs.count != '1'
        continue-on-error: true
        env:
          REQUIREMENT: ${{ steps.meta.outputs.requirement }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ai/suite
          opencode run --standalone \
            --agent suite-review \
            --model "$OPENCODE_MODEL" \
            --title "Suite review: $REQUIREMENT" \
            "Read ai/suite/input.json and the reviews in ai/reviews/. Write ai/suite/review.json only. Follow the suite-review agent instructions exactly."

      - name: Verify suite review
        if: steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.mode == 'batch' && steps.prepare.outputs.count != '1'
        continue-on-error: true
        run: node scripts/verify-suite.mjs

      - name: Upload the dossiers and drafts
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: review-draft-${{ github.run_id }}
          path: ai/
          retention-days: 30

      - name: Validate and build
        if: steps.prepare.outputs.skip != 'true'
        run: |
          npm run validate
          npm run build
          npm run check

      - name: Open pull request
        if: steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REQUIREMENT: ${{ steps.meta.outputs.requirement }}
        run: |
          set -euo pipefail

          COUNT="${{ steps.prepare.outputs.count }}"
          if [ "$COUNT" = "1" ]; then
            PKG_LABEL="1 package"
          else
            PKG_LABEL="${COUNT} packages"
          fi
          BRANCH="review/${REQUIREMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "opencode-review-bot"
          git config user.email "opencode-review-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data
          git commit -m "review: draft ${PKG_LABEL} for ${REQUIREMENT}"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -u origin "$BRANCH"

          PACKAGE_LIST=$(node -e 'const r=require("./ai/request.json"); const byName=new Map(r.packages.map(p=>[p.name,p])); console.log(r.pending.map(name=>{const p=byName.get(name)||{}; return `- \`${name}\`${p.version?`@${p.version}`:""}`}).join("\n"))')
          SKIPPED_LIST=$(node -e 'const r=require("./ai/request.json"); console.log((r.skipped||[]).map(s=>`- \`${s.name}\`: ${s.reason}`).join("\n"))')

          BODY="AI-drafted review(s) for \`${REQUIREMENT}\`.

          ${PACKAGE_LIST}

          - Request: ${ISSUE_URL:-manual run}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This PR adds the reviews only. It does not change a whitelist decision.
          Check the evidence, edit the verdicts if needed, then add each package
          to exactly one bucket in \`data/decisions.json\` in a decision PR."

          if [ -n "$SKIPPED_LIST" ]; then
            BODY="$BODY

          Skipped because they already have a review for this requirement:
          $SKIPPED_LIST"
          fi

          SUITE_NOTES=$(node -e 'const fs=require("fs"); if(!fs.existsSync("ai/suite/review.ok")) process.exit(0); const s=JSON.parse(fs.readFileSync("ai/suite/review.json","utf8")); const lines=[`**${s.recommendation}** — ${s.summary}`]; if(s.compatibility?.length){lines.push("","**Compatibility**",...s.compatibility.map(x=>`- ${x}`));} if(s.shared_risks?.length){lines.push("","**Shared risks**",...s.shared_risks.map(x=>`- ${x}`));} if(s.per_package?.length){lines.push("","**Per package**"); for(const p of s.per_package) lines.push(`- \`${p.name}\`: ${p.note}`);} if(s.decision_note) lines.push("",s.decision_note); process.stdout.write(lines.join("\n"));' 2>/dev/null || true)

          if [ -n "$SUITE_NOTES" ]; then
            BODY="$BODY

          ### Suite review
          $SUITE_NOTES"
          fi

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "review: ${PKG_LABEL} for ${REQUIREMENT}" \
            --body "$BODY")

          echo "Opened $PR_URL"
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Draft reviews opened: $PR_URL"
          fi

      - name: Already reviewed
        if: steps.prepare.outputs.skip == 'true' && github.event.issue.number
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "Every requested package already has a review for that requirement; no draft was opened."
