name: Package review request
description: Ask for a package to be reviewed against a requirement
title: "[review] "
body:
  - type: markdown
    attributes:
      value: |
        A repository collaborator will triage this request and add the
        `review-request` label. Only people with write access to the repository
        can apply that label. The workflow checks the labeler again before it
        spends any tokens. A human still approves the review and the decision.

  - type: textarea
    id: packages
    attributes:
      label: npm package names
      description: |
        One package per line. Use the exact registry name, including the scope.
        Add @version to a line if you need a specific version; leave it off for
        the latest release. Up to 20 packages per request.
      placeholder: |
        @neo4j-nvl/react
        @neo4j-bloom/dagre
        @neo4j-nvl/layout-workers
        @neo4j-nvl/interaction-handlers
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version applied to packages without one
      description: Optional. Leave blank unless every package should use the same exact version.
      placeholder: "1.2.3"

  - type: dropdown
    id: mode
    attributes:
      label: Review mode
      description: |
        Batch treats the packages as a related suite and adds suite notes to the
        PR. Separate reviews each package independently and skips suite notes.
        Both modes open one pull request.
      options:
        - Batch — related suite, with suite notes
        - Separate — independent reviews, no suite notes
      default: 0
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Requirement ID or slug
      description: Use an existing requirement, or describe why a new one is needed.
      placeholder: "req-deep-merge"
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: The task, the inputs, and why an existing package does not fit.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other packages, or the current workaround.

  - type: textarea
    id: evidence
    attributes:
      label: Links and evidence
      description: Advisory links, benchmarks, repository, or a failing test.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I checked that this package is not already reviewed for this requirement.
          required: true
        - label: I maintain or contribute to this package (disclose below).
        - label: I understand that the AI draft is advisory and a human decides.
          required: true
