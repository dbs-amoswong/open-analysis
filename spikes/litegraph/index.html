<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiteGraph spike</title>
  <style>
    body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6fa; color: #172033; }
    header { padding: 18px 24px 10px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0; color: #526077; }
    #graph { width: calc(100vw - 48px); height: calc(100vh - 170px); min-height: 480px; margin: 10px 24px 24px; background: #1f2533; border: 1px solid #0f172a; border-radius: 10px; box-shadow: 0 8px 24px rgba(31,45,70,.08); overflow: hidden; }
    canvas { display: block; }
    footer { padding: 0 24px 18px; color: #526077; font-size: 12px; }
  </style>
</head>
<body>
  <header><h1>LiteGraph spike</h1><p>20 nodes · 20 edges · Canvas2D node editor</p></header>
  <div id="graph"><canvas id="canvas"></canvas></div>
  <footer id="status">Mounting…</footer>
  <script type="module" src="/main.js"></script>
</body>
</html>
